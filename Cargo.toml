[package]
name = "speedupy_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Prebuilt native hash functions for SpeeduPy: a5hash, MeowHash 0.5 and MuseAir BFast"
repository = "https://github.com/dew-uff/speedupy-native"
publish = false

[lib]
name = "_speedupy_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: one wheel per platform for every Python from 3.10 on (retrofit D6).
pyo3 = { version = "0.25", features = ["abi3-py310", "extension-module"] }
# The vendored MuseAir source, built as an rlib through the bridge manifest in
# crates/museair (the fork's own Cargo.toml only produces a cdylib).
museair = { path = "crates/museair" }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
