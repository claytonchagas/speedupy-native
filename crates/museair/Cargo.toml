# Bridge manifest: builds the vendored MuseAir source (vendor/museair/src/lib.rs,
# the upstream file at tag v0.4, unchanged) as a Rust library the extension
# can link, with the features of the upstream manifest
# (vendor/museair/Cargo.toml.upstream). The source file is never edited: a new
# version is a new copy, recorded in NOTICE.
[package]
name = "museair"
version = "0.4.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "museair"
path = "../../vendor/museair/src/lib.rs"

[features]
default = ["std"]
std = []
